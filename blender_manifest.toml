schema_version = "1.0.0"

id = "auxlink"
version = "1.2.7"
name = "Auxlink"
tagline = "Modifier presets, stack editor & Autolattice for Blender"
maintainer = "Auxerov"
type = "add-on"

website = "https://github.com/Auxerov/Auxlink"
tags = ["Object"]

blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Auxerov",
]

[permissions]
files = "Read and write modifier presets YAML file"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.pyc",
  "*.zip",
  ".gitignore",
  "README.md",
  "build.sh",
]
